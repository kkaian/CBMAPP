# Lembretes diários (Web Push). Roda de hora em hora; o script só envia na hora escolhida no app.
# Secrets: SUPABASE_DB_URL (string do pooler com a senha), VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY.
name: Lembretes de estudo

on:
  schedule:
    - cron: '5 9-23 * * *' # minuto 5, das 6h às 20h de Maceió (UTC−3)
    - cron: '5 0-2 * * *'  # 21h às 23h de Maceió
  workflow_dispatch:
    inputs:
      hora:
        description: 'Forçar uma hora (0–23, horário de Maceió) para testar'
        required: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund pg@8 web-push@3
      - run: node scripts/enviar-lembretes.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          HORA: ${{ github.event.inputs.hora }}
